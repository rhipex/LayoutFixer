name: Finalize exact v1.0.0

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.title == 'Publish LayoutFixer v1.0.0'
    runs-on: windows-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Restore exact tested source
        shell: pwsh
        run: |
          $parts = 1..6 | ForEach-Object { Get-Content -Raw ("fix_src/main.b64.{0:D2}" -f $_) }
          $b64 = ($parts -join '').Trim()
          [IO.File]::WriteAllBytes('main.go', [Convert]::FromBase64String($b64))
          $sourceHash = (Get-FileHash main.go -Algorithm SHA256).Hash.ToLower()
          Write-Host "main.go SHA256: $sourceHash"
          if ($sourceHash -ne '961c01ba7404759a6076a464b40f3e26e884fe967ba865b38e3ec96a10d75c78') {
            throw "Exact tested source verification failed: $sourceHash"
          }

      - name: Build Windows x64 executable
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o LayoutFixer.exe .
          if (-not (Test-Path LayoutFixer.exe)) { throw 'LayoutFixer.exe was not produced' }
          $exeHash = (Get-FileHash LayoutFixer.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content SHA256SUMS.txt "$exeHash  LayoutFixer.exe"
          Write-Host "LayoutFixer.exe SHA256: $exeHash"

      - name: Commit exact source and binary
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r fix_src
          git rm .github/workflows/release.yml
          git add main.go LayoutFixer.exe SHA256SUMS.txt
          git commit -m "Publish exact LayoutFixer v1.0.0"
          git push origin main

      - name: Point v1.0.0 tag at final commit
        shell: pwsh
        run: |
          git tag -fa v1.0.0 -m "LayoutFixer v1.0.0"
          git push --force origin v1.0.0

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.0.0 --title "LayoutFixer v1.0.0" --notes-file RELEASE_NOTES_v1.0.0.md
          }
          gh release upload v1.0.0 LayoutFixer.exe SHA256SUMS.txt --clobber
          gh release view v1.0.0 --json url,tagName,name,assets
