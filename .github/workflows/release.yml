name: Verify and publish v1.0.0

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.title == 'Publish LayoutFixer v1.0.0'
    runs-on: windows-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify source and executable
        shell: pwsh
        run: |
          $sourceHash = (Get-FileHash main.go -Algorithm SHA256).Hash.ToLower()
          if ($sourceHash -ne '961c01ba7404759a6076a464b40f3e26e884fe967ba865b38e3ec96a10d75c78') { throw "Unexpected source hash: $sourceHash" }
          if (-not (Test-Path LayoutFixer.exe)) { throw 'LayoutFixer.exe is missing' }
          $exeHash = (Get-FileHash LayoutFixer.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content SHA256SUMS.txt "$exeHash  LayoutFixer.exe"
          Write-Host "LayoutFixer.exe SHA256: $exeHash"

      - name: Ensure v1.0.0 release and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.0.0 --title "LayoutFixer v1.0.0" --notes-file RELEASE_NOTES_v1.0.0.md
          }
          gh release upload v1.0.0 LayoutFixer.exe SHA256SUMS.txt --clobber

      - name: Commit checksum and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release.yml
          git add SHA256SUMS.txt
          git commit -m "Verify LayoutFixer v1.0.0 release"
          git push origin main
